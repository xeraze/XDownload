<svg xmlns="http://www.w3.org/2000/svg" width="960" height="260" viewBox="0 0 960 260" role="img" aria-label="XDownload">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="55%" stop-color="#0b1220"/>
      <stop offset="100%" stop-color="#101a2b"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#26a5e4"/>
      <stop offset="50%" stop-color="#7c5cff"/>
      <stop offset="100%" stop-color="#ff5c8a"/>
    </linearGradient>
    <linearGradient id="gem" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e6f6ff"/>
      <stop offset="100%" stop-color="#8fd4ff"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="10" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="24"/>
    </filter>
  </defs>

  <!-- backdrop -->
  <rect width="960" height="260" rx="18" fill="url(#bg)"/>
  <ellipse cx="180" cy="60" rx="220" ry="90" fill="#26a5e4" opacity="0.14" filter="url(#soft)"/>
  <ellipse cx="800" cy="220" rx="240" ry="100" fill="#7c5cff" opacity="0.14" filter="url(#soft)"/>

  <!-- gem mark -->
  <g transform="translate(96 74)" filter="url(#glow)">
    <path d="M34 0 L64 34 L34 96 L4 34 Z" fill="none" stroke="url(#gem)" stroke-width="4" stroke-linejoin="round"/>
    <path d="M4 34 H64 M34 0 L20 34 L34 96 L48 34 Z" fill="none" stroke="url(#gem)" stroke-width="2.4" opacity="0.85" stroke-linejoin="round"/>
  </g>

  <!-- title -->
  <text x="196" y="112" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="56" font-weight="700" fill="#ffffff" letter-spacing="1">XDownload</text>
  <text x="198" y="150" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="21" fill="#9fb3cc">Telegram bot · link in, file out</text>

  <!-- pills -->
  <g font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16" font-weight="600">
    <rect x="198" y="176" width="86" height="34" rx="17" fill="#132233" stroke="#26a5e4" stroke-width="1.6"/>
    <text x="241" y="199" fill="#8fd4ff" text-anchor="middle">mp3</text>

    <rect x="296" y="176" width="196" height="34" rx="17" fill="#132233" stroke="#7c5cff" stroke-width="1.6"/>
    <text x="394" y="199" fill="#c3b5ff" text-anchor="middle">480p · 720p · 1080p</text>

    <rect x="504" y="176" width="150" height="34" rx="17" fill="#132233" stroke="#ff5c8a" stroke-width="1.6"/>
    <text x="579" y="199" fill="#ffb3c7" text-anchor="middle">12 platforms</text>
  </g>

  <!-- accent line -->
  <rect x="0" y="248" width="960" height="4" fill="url(#accent)"/>
</svg>
